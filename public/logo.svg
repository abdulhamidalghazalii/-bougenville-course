<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="gradYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="10" y="10" width="180" height="180" rx="42" fill="#FFFFFF" filter="url(#softShadow)" />
  <rect x="10" y="10" width="180" height="180" rx="42" fill="none" stroke="#E2E8F0" stroke-width="2" />

  <!-- Open Book Base -->
  <g transform="translate(100, 108)">
    <!-- Left page -->
    <path d="M-60,18 C-40,8 -15,10 0,22 C-15,6 -40,4 -60,14 Z" fill="#93C5FD" opacity="0.4" />
    <path d="M-60,-22 C-38,-34 -15,-30 0,-18 L0,18 C-15,8 -40,4 -60,14 Z" fill="url(#gradSky)" />
    <!-- Right page -->
    <path d="M60,18 C40,8 15,10 0,22 C15,6 40,4 60,14 Z" fill="#FBCFE8" opacity="0.4" />
    <path d="M60,-22 C38,-34 15,-30 0,-18 L0,18 C15,8 40,4 60,14 Z" fill="url(#gradPink)" />

    <!-- Page lines -->
    <path d="M-45,-12 C-30,-18 -15,-16 -6,-10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M-45,-2 C-30,-8 -15,-6 -6,0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M45,-12 C30,-18 15,-16 6,-10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M45,-2 C30,-8 15,-6 6,0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Book spine center -->
    <ellipse cx="0" cy="18" rx="3" ry="5" fill="#1E293B" opacity="0.3" />
  </g>

  <!-- Glowing Star with smile rising from book -->
  <g transform="translate(100, 60)">
    <polygon points="0,-24 7,-8 24,-7 11,4 15,21 0,11 -15,21 -11,4 -24,-7 -7,-8" fill="url(#gradYellow)" />
    <!-- Happy eyes -->
    <circle cx="-5" cy="-2" r="2" fill="#78350F" />
    <circle cx="5" cy="-2" r="2" fill="#78350F" />
    <!-- Happy smile -->
    <path d="M-4,4 Q0,8 4,4" fill="none" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Little sparkle dots -->
  <circle cx="55" cy="48" r="3" fill="#60A5FA" />
  <circle cx="145" cy="52" r="3.5" fill="#F472B6" />
  <circle cx="152" cy="74" r="2" fill="#FCD34D" />
</svg>
